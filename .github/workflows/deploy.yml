name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    # 外部cron（cron-job.org 等）から確実に発火させるための入口。
    # 例: curl -XPOST -H "Authorization: token <PAT>" \
    #     https://api.github.com/repos/<owner>/<repo>/dispatches -d '{"event_type":"update-rates"}'
    types: [update-rates]
  schedule:
    # 金・プラチナ相場の毎営業日更新。田中は営業日 9:30 JST(=00:30 UTC) に当日価格を公表。
    # ★GitHubのcronは数時間の遅延・その日丸ごとスキップが起きる（実測）。対策として
    #   9:30 JST以降を“面”で厚く（30分毎）叩き、どれか1本でも発火すれば当日価格を確定させる。
    #   ※スクリプトは「当日未公表＝前日と同値なら据え置き」なので、早朝・空振り実行でも誤表示しない。
    #   ※分は混雑による遅延を避けるため毎時ちょうど(:00)を外して :07/:37 に分散。
    # --- 午前〜午後：30分毎（JST 09:07〜15:37）公表直後を最も厚く ---
    - cron: "7 0 * * *"    # 09:07 JST
    - cron: "37 0 * * *"   # 09:37 JST（公表直後・本命）
    - cron: "7 1 * * *"    # 10:07 JST
    - cron: "37 1 * * *"   # 10:37 JST
    - cron: "7 2 * * *"    # 11:07 JST
    - cron: "37 2 * * *"   # 11:37 JST
    - cron: "7 3 * * *"    # 12:07 JST
    - cron: "37 3 * * *"   # 12:37 JST
    - cron: "7 4 * * *"    # 13:07 JST
    - cron: "37 4 * * *"   # 13:37 JST
    - cron: "7 5 * * *"    # 14:07 JST
    - cron: "37 5 * * *"   # 14:37 JST
    - cron: "7 6 * * *"    # 15:07 JST
    # --- 夕方〜夜：1時間毎（JST 16:07〜21:07）取りこぼし保険 ---
    - cron: "7 7 * * *"    # 16:07 JST
    - cron: "7 8 * * *"    # 17:07 JST
    - cron: "7 9 * * *"    # 18:07 JST
    - cron: "7 10 * * *"   # 19:07 JST
    - cron: "7 11 * * *"   # 20:07 JST
    - cron: "7 12 * * *"   # 21:07 JST
    # --- 深夜の最終保険（前日分の取りこぼし回収） ---
    - cron: "7 15 * * *"   # 00:07 JST

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update rates (田中貴金属 → 三菱マテリアル → 前回成功データ維持)
        run: npm run update-rates
        continue-on-error: true
      - name: Update おたからや店舗数 (公式 → 前回値維持・ベストエフォート)
        run: npm run update-otakaraya
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Persist data (rates.json / otakaraya.json の last-good を保存し凍結を防止)
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/data/rates.json src/data/otakaraya.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/rates.json src/data/otakaraya.json
            git commit -m "chore(data): 相場・店舗数 自動更新 [skip ci]"
            git push
          else
            echo "rates.json / otakaraya.json に変更なし"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
