name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 金・プラチナ相場を毎日最新化するための再ビルド。
    # 取得元は 田中貴金属（主）→ 三菱マテリアル（副）。両社とも営業日の朝(≈9:30 JST)に当日価格へ更新される。
    # GitHubのcronは遅延・スキップが頻発するため、当日価格の公表時刻(朝)直後を厚めに、
    # かつ一日を通して冗長に叩く（どれか1本でも当日価格を拾えれば確定する）。
    # ※スクリプト側は「当日価格が未公表（前日と同値）なら据え置き」なので、空振りでも誤表示にならない。
    - cron: "40 0 * * *"   # 09:40 JST（公表直後・本命①）
    - cron: "15 1 * * *"   # 10:15 JST（本命②）
    - cron: "30 2 * * *"   # 11:30 JST（午前の保険）
    - cron: "0 4 * * *"    # 13:00 JST（昼の取りこぼし対策）
    - cron: "30 6 * * *"   # 15:30 JST（午後の保険）
    - cron: "0 9 * * *"    # 18:00 JST（夕方の保険）
    - cron: "0 12 * * *"   # 21:00 JST（夜の最終確認）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update rates (田中貴金属 → 三菱マテリアル → 前回成功データ維持)
        run: npm run update-rates
        continue-on-error: true
      - name: Update おたからや店舗数 (公式 → 前回値維持・ベストエフォート)
        run: npm run update-otakaraya
        continue-on-error: true
      - name: Build
        run: npm run build
      - name: Persist data (rates.json / otakaraya.json の last-good を保存し凍結を防止)
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/data/rates.json src/data/otakaraya.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/rates.json src/data/otakaraya.json
            git commit -m "chore(data): 相場・店舗数 自動更新 [skip ci]"
            git push
          else
            echo "rates.json / otakaraya.json に変更なし"
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
