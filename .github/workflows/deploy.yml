name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 金・プラチナ相場を毎日最新化するための再ビルド。
    # まねきやは午前中に当日相場へ更新されるため、朝イチ(7時台)だと前日値を拾う。
    # そこで「まねきや更新後」の時間帯に複数回実行する（GitHubのcronは遅延・スキップがあるため冗長化）。
    - cron: "30 1 * * *"   # 10:30 JST（まねきや更新後・メインの更新）
    - cron: "30 6 * * *"   # 15:30 JST（昼の取りこぼし対策）
    - cron: "30 10 * * *"  # 19:30 JST（夕方の保険）

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
