<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">喜平を売る正しい順番</title><desc id="d">今いくらか聞く、ほかのお店と比べる、納得したら売るという3ステップ</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d875"/><stop offset=".5" stop-color="#c78d18"/><stop offset="1" stop-color="#8c5807"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefb"/><stop offset="1" stop-color="#fff5dd"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
 <style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}.d{fill:#27231f}.g{fill:#a66d08}.b{font-weight:900}.p{font-size:25px;font-weight:700}</style>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="600" y="110" text-anchor="middle" class="d b" font-size="64">喜平を売る<tspan class="g">正しい順番</tspan></text>
<line x1="210" y1="145" x2="990" y2="145" stroke="#d7aa46" stroke-width="3"/>

<g filter="url(#s)">
 <rect x="55" y="220" width="330" height="420" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="435" y="220" width="330" height="420" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="815" y="220" width="330" height="420" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
</g>
<g fill="url(#gold)"><circle cx="220" cy="220" r="48"/><circle cx="600" cy="220" r="48"/><circle cx="980" cy="220" r="48"/></g>
<g fill="#fff" font-size="43" font-weight="900" text-anchor="middle"><text x="220" y="235">1</text><text x="600" y="235">2</text><text x="980" y="235">3</text></g>

<text x="220" y="335" text-anchor="middle" class="b" font-size="42"><tspan class="g">今いくらか</tspan></text><text x="220" y="382" text-anchor="middle" class="d b" font-size="42">聞く</text>
<!-- phone -->
<path d="M133 425 C150 392 177 397 188 422 L202 455 C210 472 199 488 183 494 C213 534 247 557 287 567 C291 548 306 538 322 545 L350 560 C375 573 374 602 347 617 C318 634 282 623 246 605 C193 579 153 542 128 495 C115 470 117 447 133 425z" fill="#404040"/>
<circle cx="300" cy="450" r="54" fill="#fff8e8" stroke="#c79325" stroke-width="5"/>
<g fill="none" stroke="url(#gold)" stroke-width="8"><ellipse cx="278" cy="450" rx="27" ry="15"/><ellipse cx="310" cy="459" rx="27" ry="15"/><ellipse cx="337" cy="447" rx="27" ry="15"/></g>
<rect x="80" y="570" width="280" height="55" rx="18" fill="#fff6e5"/><text x="220" y="605" text-anchor="middle" class="p d">今の買取価格を聞く</text>

<text x="600" y="335" text-anchor="middle" class="g b" font-size="42">ほかのお店と</text><text x="600" y="382" text-anchor="middle" class="d b" font-size="42">比べる</text>
<!-- scale -->
<line x1="600" y1="420" x2="600" y2="555" stroke="#555" stroke-width="10"/><line x1="520" y1="445" x2="680" y2="445" stroke="#555" stroke-width="9"/>
<path d="M520 445 l-40 75 h80z" fill="#eee" stroke="#777" stroke-width="4"/><path d="M680 445 l-40 75 h80z" fill="#eee" stroke="#777" stroke-width="4"/>
<g><rect x="482" y="470" width="76" height="50" rx="5" fill="#f4d26d"/><rect x="493" y="454" width="54" height="20" fill="#c98c1c"/><text x="520" y="505" text-anchor="middle" class="d b" font-size="20">A店</text></g>
<g><rect x="642" y="470" width="76" height="50" rx="5" fill="#f4d26d"/><rect x="653" y="454" width="54" height="20" fill="#c98c1c"/><text x="680" y="505" text-anchor="middle" class="d b" font-size="20">B店</text></g>
<rect x="460" y="570" width="280" height="55" rx="18" fill="#fff6e5"/><text x="600" y="605" text-anchor="middle" class="p d">査定額を比べる</text>

<text x="980" y="335" text-anchor="middle" class="g b" font-size="42">納得したら</text><text x="980" y="382" text-anchor="middle" class="d b" font-size="42">売る</text>
<!-- check + handshake style -->
<circle cx="980" cy="462" r="58" fill="#fff8e8" stroke="#c79325" stroke-width="6"/>
<path d="M950 461 l20 20 42-48" fill="none" stroke="#333" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M890 545 C925 520 955 520 980 540 C1005 520 1035 520 1070 545 L1038 583 C1015 603 995 598 980 580 C965 598 945 603 922 583z" fill="#555"/>
<rect x="840" y="570" width="280" height="55" rx="18" fill="#fff6e5"/><text x="980" y="605" text-anchor="middle" class="p d">納得できたら売る</text>

<!-- arrows -->
<g fill="#c79325"><path d="M400 430 l42 30 -42 30z"/><path d="M780 430 l42 30 -42 30z"/></g>

<rect x="70" y="690" width="1060" height="72" rx="25" fill="#fff" stroke="#d7aa46" stroke-width="4"/>
<text x="600" y="738" text-anchor="middle" class="d b" font-size="34">査定を受けても、<tspan class="g">売る義務はありません。</tspan></text>
<rect x="70" y="790" width="1060" height="76" rx="28" fill="url(#gold)"/>
<text x="600" y="841" text-anchor="middle" fill="#fff" class="b" font-size="39">まずは「今の値段を知る」だけでOK。</text>
</svg>