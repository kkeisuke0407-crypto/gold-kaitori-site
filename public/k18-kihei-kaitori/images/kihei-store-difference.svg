<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">同じ喜平でも、お店によって査定額は変わります</title>
<desc id="d">同じ18金喜平でも、買取店によって査定の見方や手数料が異なることを示す図</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5d879"/><stop offset=".45" stop-color="#c99928"/><stop offset="1" stop-color="#8e5c0b"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset="1" stop-color="#fff6df"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
 <style>
 text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}
 .dark{fill:#27231f}.gold{fill:#a66d08}.small{font-size:28px}.body{font-size:31px;font-weight:700}.cardTitle{font-size:46px;font-weight:900}
 </style>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="600" y="82" text-anchor="middle" class="dark" font-size="52" font-weight="900">同じ喜平でも、</text>
<text x="600" y="145" text-anchor="middle" class="dark" font-size="52" font-weight="900">お店によって<tspan class="gold">査定額は変わります</tspan></text>
<line x1="250" y1="176" x2="950" y2="176" stroke="#d7aa46" stroke-width="3"/>
<text x="600" y="220" text-anchor="middle" class="gold" font-size="28" font-weight="800">18金 喜平ネックレス</text>

<!-- chain -->
<g transform="translate(390 242)" fill="none" stroke="url(#gold)" stroke-width="14">
  <ellipse cx="30" cy="42" rx="36" ry="20" transform="rotate(18 30 42)"/>
  <ellipse cx="86" cy="60" rx="36" ry="20" transform="rotate(18 86 60)"/>
  <ellipse cx="142" cy="72" rx="36" ry="20" transform="rotate(10 142 72)"/>
  <ellipse cx="198" cy="78" rx="36" ry="20"/>
  <ellipse cx="254" cy="72" rx="36" ry="20" transform="rotate(-10 254 72)"/>
  <ellipse cx="310" cy="60" rx="36" ry="20" transform="rotate(-18 310 60)"/>
  <ellipse cx="366" cy="42" rx="36" ry="20" transform="rotate(-18 366 42)"/>
</g>

<!-- arrows -->
<g stroke="#c79325" stroke-width="5" fill="none"><path d="M520 355 C430 390 300 410 215 450"/><path d="M600 355 V450"/><path d="M680 355 C770 390 900 410 985 450"/></g>
<g fill="#c79325"><path d="M202 447 l28 -4 -12 26z"/><path d="M600 465 l-14 -25 h28z"/><path d="M998 447 l-28 -4 12 26z"/></g>

<!-- cards -->
<g filter="url(#shadow)">
 <rect x="55" y="465" width="330" height="285" rx="24" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="435" y="465" width="330" height="285" rx="24" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="815" y="465" width="330" height="285" rx="24" fill="#fff" stroke="#d8ad4e" stroke-width="3"/>
</g>
<rect x="55" y="465" width="330" height="70" rx="24" fill="#f0f0ef"/><rect x="55" y="510" width="330" height="25" fill="#f0f0ef"/>
<rect x="435" y="465" width="330" height="70" rx="24" fill="#f6efe2"/><rect x="435" y="510" width="330" height="25" fill="#f6efe2"/>
<rect x="815" y="465" width="330" height="70" rx="24" fill="#f7e3a5"/><rect x="815" y="510" width="330" height="25" fill="#f7e3a5"/>
<text x="220" y="515" text-anchor="middle" class="cardTitle dark">A店</text>
<text x="600" y="515" text-anchor="middle" class="cardTitle dark">B店</text>
<text x="980" y="515" text-anchor="middle" class="cardTitle dark">C店</text>

<!-- icons + copy -->
<g transform="translate(105 565)">
 <rect x="0" y="60" width="110" height="18" rx="9" fill="#777"/><rect x="46" y="0" width="18" height="60" fill="#777"/>
 <path d="M25 15 h60 l-10 35 h-40z" fill="url(#gold)"/>
</g>
<text x="270" y="602" text-anchor="middle" class="body dark">金の重さを</text><text x="270" y="647" text-anchor="middle" class="body dark">中心に査定</text>

<g transform="translate(485 565)">
 <rect x="4" y="0" width="74" height="95" rx="10" fill="#777"/><rect x="17" y="15" width="48" height="20" rx="4" fill="#eee"/>
 <g fill="#eee"><circle cx="22" cy="53" r="6"/><circle cx="42" cy="53" r="6"/><circle cx="62" cy="53" r="6"/><circle cx="22" cy="73" r="6"/><circle cx="42" cy="73" r="6"/><circle cx="62" cy="73" r="6"/></g>
 <circle cx="100" cy="75" r="27" fill="#d7a535"/><text x="100" y="85" text-anchor="middle" font-size="33" font-weight="900" fill="#fff">−</text>
</g>
<text x="655" y="602" text-anchor="middle" class="body gold">手数料が</text><text x="655" y="647" text-anchor="middle" class="body dark">引かれる</text>

<g transform="translate(855 570)" fill="none" stroke="url(#gold)" stroke-width="9">
 <ellipse cx="30" cy="35" rx="28" ry="16"/><ellipse cx="70" cy="48" rx="28" ry="16"/><ellipse cx="110" cy="35" rx="28" ry="16"/>
 <circle cx="150" cy="58" r="38" stroke="#86600c" stroke-width="8"/><line x1="178" y1="86" x2="208" y2="116" stroke="#333" stroke-width="12" stroke-linecap="round"/>
</g>
<text x="1010" y="602" text-anchor="middle" class="body gold">喜平としても査定</text><text x="1010" y="650" text-anchor="middle" class="body dark">手数料なし</text>

<!-- footer -->
<rect x="65" y="785" width="1070" height="78" rx="28" fill="url(#gold)"/>
<text x="600" y="838" text-anchor="middle" fill="#fff" font-size="40" font-weight="900">だから、店選びが大切です</text>
</svg>