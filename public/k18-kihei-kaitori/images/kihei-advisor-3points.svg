<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
<title id="t">元買取業者なら、ここを見ます</title><desc id="d">喜平査定で確認する3つのポイント</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2d570"/><stop offset=".5" stop-color="#c68c18"/><stop offset="1" stop-color="#8a5605"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffefb"/><stop offset="1" stop-color="#fff6df"/></linearGradient>
 <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter>
 <style>text{font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif}.d{fill:#27231f}.g{fill:#a96f08}.h{font-size:40px;font-weight:900}.p{font-size:27px;font-weight:700}</style>
</defs>
<rect width="1200" height="900" rx="28" fill="url(#bg)"/>
<text x="600" y="92" text-anchor="middle" class="d" font-size="58" font-weight="900">元買取業者なら、ここを<tspan class="g">見ます</tspan></text>
<rect x="155" y="125" width="890" height="62" rx="31" fill="#fff7e8"/>
<text x="600" y="166" text-anchor="middle" class="d" font-size="27" font-weight="700">むずかしいことは、覚えなくて大丈夫。見るのは、<tspan class="g">この3つだけ。</tspan></text>

<g filter="url(#s)">
 <rect x="55" y="245" width="330" height="440" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="435" y="245" width="330" height="440" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
 <rect x="815" y="245" width="330" height="440" rx="28" fill="#fff" stroke="#ead7ac" stroke-width="2"/>
</g>
<g fill="url(#gold)">
 <circle cx="220" cy="245" r="48"/><circle cx="600" cy="245" r="48"/><circle cx="980" cy="245" r="48"/>
</g>
<g fill="#fff" font-size="43" font-weight="900" text-anchor="middle"><text x="220" y="260">1</text><text x="600" y="260">2</text><text x="980" y="260">3</text></g>

<text x="220" y="340" text-anchor="middle" class="h"><tspan class="g">全部で</tspan><tspan class="d">いくら？</tspan></text>
<g transform="translate(125 385)">
 <rect x="10" y="30" width="130" height="85" rx="8" fill="#e4d3b4" stroke="#b69b73" stroke-width="3"/>
 <circle cx="75" cy="72" r="25" fill="#f8f0df"/><text x="75" y="83" text-anchor="middle" class="d" font-size="32" font-weight="900">¥</text>
 <rect x="118" y="62" width="70" height="90" rx="10" fill="#555"/><rect x="131" y="78" width="44" height="18" rx="4" fill="#eee"/>
 <g fill="#eee"><circle cx="140" cy="113" r="6"/><circle cx="158" cy="113" r="6"/><circle cx="140" cy="132" r="6"/><circle cx="158" cy="132" r="6"/></g>
</g>
<rect x="87" y="555" width="266" height="95" rx="18" fill="#fff6e5"/>
<text x="220" y="593" text-anchor="middle" class="p d">最終的に、</text><text x="220" y="628" text-anchor="middle" class="p g">いくらになるかを見る</text>

<text x="600" y="340" text-anchor="middle" class="h"><tspan class="g">何か</tspan><tspan class="d">引かれない？</tspan></text>
<g transform="translate(515 388)">
 <rect x="5" y="0" width="120" height="150" rx="8" fill="#eee2ce" stroke="#b69b73" stroke-width="3"/>
 <text x="65" y="40" text-anchor="middle" class="d" font-size="24" font-weight="900">手数料</text>
 <line x1="28" y1="65" x2="102" y2="65" stroke="#b69b73" stroke-width="4"/><line x1="28" y1="86" x2="90" y2="86" stroke="#b69b73" stroke-width="4"/>
 <circle cx="135" cy="108" r="34" fill="#d95a2a"/><text x="135" y="121" text-anchor="middle" fill="#fff" font-size="42" font-weight="900">−</text>
</g>
<rect x="467" y="555" width="266" height="95" rx="18" fill="#fff6e5"/>
<text x="600" y="593" text-anchor="middle" class="p d">手数料があると、</text><text x="600" y="628" text-anchor="middle" class="p g">手元に残る金額が減る</text>

<text x="980" y="340" text-anchor="middle" class="h"><tspan class="g">喜平</tspan><tspan class="d">としても見る？</tspan></text>
<g transform="translate(875 390)" fill="none" stroke="url(#gold)" stroke-width="10">
 <ellipse cx="32" cy="48" rx="31" ry="18"/><ellipse cx="78" cy="60" rx="31" ry="18"/><ellipse cx="124" cy="48" rx="31" ry="18"/>
 <circle cx="166" cy="82" r="48" stroke="#8d6710" stroke-width="9"/><line x1="202" y1="118" x2="235" y2="151" stroke="#333" stroke-width="13" stroke-linecap="round"/>
</g>
<rect x="847" y="555" width="266" height="95" rx="18" fill="#fff6e5"/>
<text x="980" y="592" text-anchor="middle" class="p d">重さだけでなく、</text><text x="980" y="628" text-anchor="middle" class="p g">喜平として見るか確認</text>

<rect x="60" y="735" width="1080" height="110" rx="30" fill="url(#gold)"/>
<text x="600" y="780" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">見るべきなのは、「今日の金の値段」ではなく、</text>
<text x="600" y="826" text-anchor="middle" fill="#fff" font-size="43" font-weight="900">最後にもらえる金額。</text>
</svg>