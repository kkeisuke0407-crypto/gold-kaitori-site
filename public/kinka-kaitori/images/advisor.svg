<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="買取アドバイザーのイラスト">
  <defs>
    <clipPath id="adv-clip"><circle cx="60" cy="60" r="58"/></clipPath>
    <linearGradient id="adv-bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fdf8ea"/><stop offset="1" stop-color="#f3e9d2"/>
    </linearGradient>
    <linearGradient id="adv-suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3450"/><stop offset="1" stop-color="#1b2233"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#adv-bg)"/>

  <g clip-path="url(#adv-clip)">
    <!-- 肩・ジャケット -->
    <path d="M14 122 C16 96 32 86 45 82 L60 78 L75 82 C88 86 104 96 106 122 Z" fill="url(#adv-suit)"/>
    <!-- インナー -->
    <path d="M50 80 L60 100 L70 80 L60 76 Z" fill="#fbfaf7"/>
    <!-- 襟 -->
    <path d="M48 81 L60 101 L54 82 Z" fill="#39435f"/>
    <path d="M72 81 L60 101 L66 82 Z" fill="#39435f"/>
    <!-- 首 -->
    <path d="M52 66 h16 v14 c0 5 -16 5 -16 0 Z" fill="#e8bd9c"/>
    <!-- 髪（後ろ） -->
    <path d="M32 52 C32 28 46 16 60 16 C74 16 88 28 88 52 L88 74 C88 78 84 78 84 74 L84 56 L36 56 L36 74 C36 78 32 78 32 74 Z" fill="#3a2b23"/>
    <!-- 顔 -->
    <ellipse cx="60" cy="48" rx="21" ry="24" fill="#f3cdae"/>
    <!-- 前髪 -->
    <path d="M39 45 C39 27 48 20 60 20 C72 20 81 27 81 45 C77 36 71 33 60 33 C49 33 43 36 39 45 Z" fill="#3a2b23"/>
    <!-- 目 -->
    <path d="M49 49 q3.6 -3.6 7.2 0" stroke="#2b2b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M63.8 49 q3.6 -3.6 7.2 0" stroke="#2b2b2e" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- 口 -->
    <path d="M55 59 q5 4.6 10 0" stroke="#b4614a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <!-- ほお -->
    <ellipse cx="47.5" cy="55" rx="3.6" ry="2.4" fill="#eda98c" opacity=".55"/>
    <ellipse cx="72.5" cy="55" rx="3.6" ry="2.4" fill="#eda98c" opacity=".55"/>
  </g>

  <circle cx="60" cy="60" r="58" fill="none" stroke="#c9a227" stroke-width="3"/>
</svg>
