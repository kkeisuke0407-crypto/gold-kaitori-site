# 既定構成はSQLite。DBコンテナ不要でそのまま立ち上がる。
# PostgreSQLへ移行する場合は下部のコメントを外し、
# docs/schema.postgres.sql を初期化スクリプトとして流し込む。

services:
  api:
    image: python:3.12-slim
    working_dir: /app/backend
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/ppc.db
    volumes:
      # 管理画面（public/tools/ppc）も配信できるようリポジトリ全体をマウントする
      - ../..:/repo:ro
      - .:/app
      - ppc_data:/app/data
    ports:
      - "8000:8000"

volumes:
  ppc_data:

